<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        box-sizing: border-box;
      }

      body {
        padding: 30px;
      }

      #main {
        width: 100%;
        height: 100%;
        background-color: #322;
      }

      #nav {
        display: flex;
        align-items: center;
        justify-content: space-around;
        width: 100%;
        height: 100px;
        background-color: #444;
      }

      a {
        color: white;
      }

      ul {
        cursor: pointer;
      }

      button {
        padding: 12px 22px;
        background-color: red;
        border-radius: 5px;
      }

      .lt {
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <ul >
        <li>Apple</li>
        <li>Guava</li>
        <li>Grapes</li>
        <li>Banana</li>
        <li>Mango</li>
    </ul>

    

    <script src="bubbling.js"></script>
  </body>
</html>
