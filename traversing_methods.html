<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        font-family:
          "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
      }
      .main {
        width: 1320px;
        margin: auto;
        padding: 30px;
        border: 3px solid red;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <h1>Hey</h1>
      <button>Save</button>
      <p>Welcome<b>to</b> <u>WS</u></p>
    </div>
  </body>
  <script>
    let btn = document.querySelector("button");
    btn.addEventListener("click", () => {
      //   btn.parentElement.remove();
      btn.parentElement.style.backgroundColor = "yellow";
      btn.previousElementSibling.innerHTML = "Welcome to USA";
      btn.nextElementSibling.style.fontSize = "30px";
      console.log(btn.nextElementSibling);
      console.log(btn.nextElementSibling.children); //gives childern in a nodelist
      console.log(btn.nextElementSibling.children[1]); //can be indexed
      btn.nextElementSibling.children[1].innerHTML = "hahahah";
    });
  </script>
</html>
