<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Search Card</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Helvetica Neue", sans-serif;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 40px;
        align-items: center;
      }

      input {
        width: 500px;
        height: 40px;
        padding: 0 12px;

        background: #111;
        color: #888;

        border: none;
        outline: none;
        border-radius: 8px;
      }

      input::placeholder {
        color: #666;
      }

      .cards {
        display: flex;
        gap: 40px;
      }

      .card {
        position: relative;
        width: 300px;
        height: 400px;
        overflow: hidden;
        border-radius: 15px;
      }

      .bg-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .blurred-layer {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 100%;

       

        background-size: cover;
        background-position: bottom;

        filter: blur(10px);

        z-index: 1;

        mask-image: linear-gradient(
          to top,
          rgba(0, 0, 0, 1),
          rgba(0, 0, 0, 0)
        );

        mask-size: 100% 100%;
        mask-repeat: no-repeat;

        -webkit-mask-image: linear-gradient(
          to top,
          rgba(0, 0, 0, 1),
          rgba(0, 0, 0, 0)
        );

        -webkit-mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
      }

      .content {
        position: absolute;
        bottom: 20px;
        left: 20px;

        color: white;

        z-index: 2;
      }

      .content h3 {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 6px;
      }

      .content p {
        font-size: 14px;
        color: #ddd;
        line-height: 1.4;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <input
        type="text"
        placeholder="Search..."
      />

      <div class="cards">
        <div class="card">
          <img
            src="https://plus.unsplash.com/premium_photo-1679692887717-dc7f5d090271?q=80&w=774&auto=format"
            class="bg-img"
          />

          <div class="blurred-layer"></div>

          <div class="content">
            <h3>User 123</h3>

            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit,
              quis.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="real_time.js"></script>
  </body>
</html>
