<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Save Notes</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
      }

      .notes {
        width: 600px;
        padding: 30px;
        background: #222;
        border-radius: 15px;
      }

      h1 {
        margin-top: 0;
      }

      textarea {
        width: 100%;
        height: 300px;
        padding: 15px;
        resize: none;
        border: none;
        outline: none;
        border-radius: 10px;
        font-size: 18px;
      }

      #status {
        margin-top: 15px;
        color: #aaa;
      }

      #get {
        padding: 6px 12px;
        font-size: 16px;
        background: white;
        color: #111;
        border: 1px solid #aaa;
        border-radius: 5px;
        cursor: pointer;
      }

      #get:hover {
        background: #eee;
      }
    </style>
  </head>

  <body>
    <div class="notes">
      <h1>My Notes</h1>

      <textarea id="notes" placeholder="Start typing..."></textarea>

      <div id="status">Not saved</div>
      <br />
      <button id="get">Notes..</button>
    </div>

    <script src="notes.js"></script>
  </body>
</html>
