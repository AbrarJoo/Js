<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timed Quiz</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .quiz {
      width: 550px;
      padding: 30px;
      background: #222;
      border-radius: 15px;
    }

    h1 {
      margin-top: 0;
    }

    #timer {
      text-align: right;
      color: #aaa;
      margin-bottom: 20px;
    }

    #question {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .answer {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      text-align: left;
    }

    .answer:hover {
      background: #ddd;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
    }

    #next {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="quiz">

    <h1>Timed Quiz</h1>

    <div id="timer">Time: 10</div>

    <div id="question">
      Question will appear here
    </div>

    <button class="answer" id="answer1"></button>
    <button class="answer" id="answer2"></button>
    <button class="answer" id="answer3"></button>
    <button class="answer" id="answer4"></button>

    <div id="result"></div>

    <button id="next">Next</button>

  </div>

  <script src="quiz.js"></script>

</body>
</html>
