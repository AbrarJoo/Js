<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download Progress</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111;
        font-family: Arial, sans-serif;
      }

      .container {
        width: 150px;
        padding: 25px 15px 15px;
        background: #1b1b1b;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 0 5px #000;
      }

      h3 {
        color: white;
        font-size: 8px;
        font-weight: 500;
        margin-bottom: 12px;
      }

      .progress-container {
        width: 100%;
        height: 6px;
        background: #303030;
        border-radius: 10px;
        overflow: hidden;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: #777;
        border-radius: 10px;
      }

      .percentage {
        margin-top: 10px;
        color: white;
        font-size: 7px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h3>Downloading...</h3>

      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>

      <p class="percentage">0%</p>
    </div>

    <script src="ti.js"></script>
  </body>
</html>
