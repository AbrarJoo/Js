<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email & Password Validator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
    }

    .container {
      width: 350px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #333;
    }

    small {
      display: block;
      margin-top: 5px;
      color: red;
      min-height: 18px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    #success {
      text-align: center;
      color: green;
      margin-top: 15px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Register</h2>

    <form autocomplete="off" id="form">

      <div class="input-group">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Enter your email">
        <small  id="emailError"></small>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
        <small id="passwordError"></small>
      </div>

      <button type="submit">Create Account</button>

      <p id="success"></p>

    </form>

  </div>

  <script src="forms.js"></script>

</body>
</html>
